spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://localhost:5432/newbank_account
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  redis:
    host: localhost
    port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.newbank: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      accountServiceCB:
        slidingWindowSize: 50
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  retry:
    instances:
      accountServiceRetry:
        maxAttempts: 3
        waitDuration: 1000
  ratelimiter:
    instances:
      accountServiceLimiter:
        limitRefreshPeriod: 1m
        limitForPeriod: 100
        timeoutDuration: 5s
